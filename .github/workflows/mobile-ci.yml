name: mobile-ci

on:
  push:
    branches: [main]
    paths: ["mobile/**", "shared/**", ".github/workflows/mobile-ci.yml"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Type-check
        run: npx tsc --noEmit
